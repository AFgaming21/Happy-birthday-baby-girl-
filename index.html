<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universe of Love 3D Galaxy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Sacramento&display=swap');
    
    body {
      margin: 0;
      overflow: hidden;
      background-color: #030008;
      font-family: 'Outfit', sans-serif;
      user-select: none;
    }

    /* Custom Glassmorphism UI */
    .glass-panel {
      background: rgba(18, 7, 28, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 105, 180, 0.25);
      box-shadow: 0 8px 32px 0 rgba(255, 20, 147, 0.2);
    }

    .neon-text-glow {
      text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #ff1493, 0 0 80px #ff1493;
    }

    .neon-btn {
      background: linear-gradient(135deg, #ff007f 0%, #7928ca 100%);
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
      transition: all 0.3s ease;
    }

    .neon-btn:hover {
      box-shadow: 0 0 25px rgba(255, 0, 127, 0.8), 0 0 35px rgba(255, 20, 147, 0.6);
      transform: translateY(-2px);
    }

    /* Canvas styling */
    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Scrollbar Styling for Modal */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 5, 25, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: #ff007f;
      border-radius: 4px;
    }
  </style>
</head>
<body class="text-white overflow-hidden">

  <!-- WebGL Container -->
  <div id="webgl-container"></div>

  <!-- UI Overlay -->
  <div class="relative z-10 pointer-events-none flex flex-col justify-between h-screen p-4 sm:p-6">
    
    <!-- Header Title -->
    <header class="text-center mt-2 pointer-events-auto">
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-rose-300 to-purple-400 neon-text-glow">
        UNIVERSE OF LOVE
      </h1>
      <p class="text-xs sm:text-sm text-pink-300/80 mt-1 font-light tracking-widest uppercase">
        <i class="fa-solid fa-arrows-spin mr-1"></i> Seret untuk pusing • Skrol untuk zum
      </p>
    </header>

    <!-- Controls Floating Panel -->
    <footer class="flex flex-col sm:flex-row items-center justify-between gap-4 pointer-events-auto max-w-4xl mx-auto w-full mb-2">
      
      <!-- Quick Action Buttons -->
      <div class="glass-panel rounded-2xl p-2 sm:p-3 flex items-center gap-2 sm:gap-3 w-full sm:w-auto justify-center">
        <button id="add-msg-btn" class="neon-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold flex items-center gap-2 text-white">
          <i class="fa-solid fa-heart-circle-plus"></i> Tambah Mesej
        </button>
        
        <button id="toggle-orbit-btn" class="bg-purple-900/50 hover:bg-purple-800/60 border border-purple-500/40 text-pink-200 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-2">
          <i id="orbit-icon" class="fa-solid fa-pause"></i> <span id="orbit-text">Jeda</span>
        </button>

        <button id="reset-cam-btn" class="bg-pink-950/40 hover:bg-pink-900/60 border border-pink-500/30 text-pink-200 px-3 py-2 rounded-xl text-xs sm:text-sm font-medium transition flex items-center gap-2">
          <i class="fa-solid fa-video"></i> Reset Kamera
        </button>
      </div>

      <!-- Speed & Density Slider Bar -->
      <div class="glass-panel rounded-2xl p-3 px-4 flex items-center gap-4 w-full sm:w-auto text-xs text-pink-200">
        <div class="flex items-center gap-2">
          <i class="fa-solid fa-gauge-high text-pink-400"></i>
          <span>Kelajuan Orbit:</span>
          <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1" class="w-20 sm:w-24 accent-pink-500 cursor-pointer">
        </div>
      </div>

    </footer>
  </div>

  <!-- Modal Add Message (Glassmorphism) -->
  <div id="msg-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-md hidden transition-opacity duration-300">
    <div class="glass-panel p-6 sm:p-8 rounded-3xl max-w-md w-full relative border border-pink-500/40">
      <button id="close-modal-btn" class="absolute top-4 right-4 text-pink-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <h3 class="text-xl font-bold text-pink-300 mb-2 flex items-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles text-pink-400"></i> Tambah Mesej Ke Galaksi
      </h3>
      <p class="text-xs text-pink-200/70 mb-5">Mesej anda akan terapung dan mengorbit di sekeliling lubang hitam cinta!</p>

      <form id="add-msg-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-pink-300 mb-1">Mesej Cinta / Nama</label>
          <input type="text" id="custom-text-input" placeholder="contoh: TE AMO, FOREVER & ALWAYS" maxlength="25" required
            class="w-full bg-purple-950/60 border border-pink-500/40 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-400 focus:ring-1 focus:ring-pink-400">
        </div>

        <div>
          <label class="block text-xs font-semibold text-pink-300 mb-1">Pilih Ikon / Sticker</label>
          <select id="custom-icon-select" class="w-full bg-purple-950/60 border border-pink-500/40 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-pink-400">
            <option value="❤️">❤️️ Hati Merah (Classic Heart)</option>
            <option value="💖">💖 Hati Kupu-Kupu (Sparkle Heart)</option>
            <option value="🎀">🎀 Hello Kitty Style Ribbon</option>
            <option value="🕷️">🕷️ Spiderman Love</option>
            <option value="👑">👑 Mahkota Cinta (Crown)</option>
            <option value="✨">✨ Bintang Neon (Magic Star)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-pink-300 mb-1">Warna Cahaya Neon</label>
          <div class="flex gap-3 mt-1">
            <label class="cursor-pointer flex items-center gap-1.5 text-xs text-pink-200">
              <input type="radio" name="neon-color" value="#ff007f" checked class="accent-pink-500"> Pink Neon
            </label>
            <label class="cursor-pointer flex items-center gap-1.5 text-xs text-purple-200">
              <input type="radio" name="neon-color" value="#a855f7" class="accent-purple-500"> Ungu Cyan
            </label>
            <label class="cursor-pointer flex items-center gap-1.5 text-xs text-rose-200">
              <input type="radio" name="neon-color" value="#ff3366" class="accent-rose-500"> Red Magenta
            </label>
          </div>
        </div>

        <button type="submit" class="w-full neon-btn py-3 rounded-xl text-sm font-bold text-white mt-4">
          <i class="fa-solid fa-paper-plane mr-1"></i> Lancarkan Ke Galaksi
        </button>
      </form>
    </div>
  </div>

  <script>
    // --- 1. SETUP SCENE, CAMERA, RENDERER & CONTROLS ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030008, 0.012);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 18, 32);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 70;
    controls.minDistance = 8;
    controls.maxPolarAngle = Math.PI / 2 + 0.1; // Don't go too far below plane

    let orbitSpeedMultiplier = 1.0;
    let isOrbiting = true;

    // --- 2. BLACK HOLE & SWIRLING ACCRETION DISK ---
    // Central Black Hole Sphere
    const bhGeo = new THREE.SphereGeometry(2.2, 64, 64);
    const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const blackHole = new THREE.Mesh(bhGeo, bhMat);
    scene.add(blackHole);

    // Event Horizon Photons Glow Outer Ring
    const horizonGeo = new THREE.SphereGeometry(2.35, 32, 32);
    const horizonMat = new THREE.MeshBasicMaterial({
      color: 0xff007f,
      transparent: true,
      opacity: 0.35,
      wireframe: true
    });
    const horizonGlow = new THREE.Mesh(horizonGeo, horizonMat);
    scene.add(horizonGlow);

    // Accretion Disk / Spiral Vortex Plane
    const diskGeo = new THREE.PlaneGeometry(28, 28, 128, 128);
    
    // Custom Shader for Dynamic Swirling Spiral Galaxy Center
    const diskShaderMat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor1: { value: new THREE.Color(0xff007f) }, // Hot Magenta
        uColor2: { value: new THREE.Color(0x7928ca) }, // Cosmic Purple
        uColor3: { value: new THREE.Color(0x000000) }  // Center Hole Void
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vPosition;
        uniform float uTime;
        void main() {
          vUv = uv;
          vPosition = position;
          vec3 pos = position;
          
          // Subtle wave height on the vortex plane
          float dist = length(pos.xy);
          pos.z += sin(dist * 2.0 - uTime * 3.0) * 0.15 * (1.0 - smoothstep(0.0, 10.0, dist));
          
          gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uColor1;
        uniform vec3 uColor2;
        uniform vec3 uColor3;
        varying vec2 vUv;
        varying vec3 vPosition;

        void main() {
          vec2 uv = vUv - 0.5;
          float dist = length(uv) * 2.0; // 0 at center, 1 at edge
          float angle = atan(uv.y, uv.x);

          // Spiral arms math formula
          float spiral = sin(angle * 4.0 - dist * 12.0 + uTime * 2.5);
          spiral = smoothstep(-0.2, 0.8, spiral);

          // Radial falloff: dark center (black hole), bright inner ring, fading edges
          float ring = smoothstep(0.12, 0.28, dist) * (1.0 - smoothstep(0.85, 1.0, dist));
          
          // Mix glowing magenta/purple based on spiral pattern
          vec3 finalColor = mix(uColor2, uColor1, spiral + 0.2);
          
          // Center void cutout for black hole
          float alpha = ring * (0.6 + 0.4 * spiral);
          if (dist < 0.16) {
            alpha = 0.0;
          }

          gl_FragColor = vec4(finalColor * 1.8, alpha);
        }
      `,
      transparent: true,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const accretionDisk = new THREE.Mesh(diskGeo, diskShaderMat);
    accretionDisk.rotation.x = -Math.PI / 2;
    scene.add(accretionDisk);

    // --- 3. SWIRLING NEON PARTICLES (SPIRAL GALAXY DUST) ---
    const particleCount = 4000;
    const particleGeo = new THREE.BufferGeometry();
    const particlePositions = new Float32Array(particleCount * 3);
    const particleColors = new Float32Array(particleCount * 3);
    const particleData = [];

    const colorPalette = [
      new THREE.Color(0xff007f), // Hot Pink
      new THREE.Color(0xff69b4), // Light Pink
      new THREE.Color(0x9333ea), // Deep Purple
      new THREE.Color(0xff1493), // Deep Pink
      new THREE.Color(0xffb6c1)  // Soft Rose
    ];

    for (let i = 0; i < particleCount; i++) {
      // Golden ratio spiral distribution
      const radius = 2.5 + Math.pow(Math.random(), 1.8) * 18;
      const armOffset = (i % 3) * ((Math.PI * 2) / 3);
      const angle = radius * 0.4 + armOffset + (Math.random() - 0.5) * 0.5;

      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;
      const y = (Math.random() - 0.5) * (1.5 * (1.0 - radius / 22)); // flatter near center

      particlePositions[i * 3] = x;
      particlePositions[i * 3 + 1] = y;
      particlePositions[i * 3 + 2] = z;

      const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
      particleColors[i * 3] = color.r;
      particleColors[i * 3 + 1] = color.g;
      particleColors[i * 3 + 2] = color.b;

      particleData.push({
        radius: radius,
        angle: angle,
        yOffset: y,
        speed: (0.005 + (1.0 / radius) * 0.02)
      });
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));

    // Glow sprite texture for particles
    function createGlowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');
      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255,255,255,1)');
      gradient.addColorStop(0.3, 'rgba(255,20,147,0.8)');
      gradient.addColorStop(0.7, 'rgba(121,40,202,0.3)');
      gradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    const particleMat = new THREE.PointsMaterial({
      size: 0.45,
      vertexColors: true,
      map: createGlowTexture(),
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // --- 4. 3D HEART GEOMETRY BUILDER ---
    function createHeartGeometry() {
      const heartShape = new THREE.Shape();
      const x = 0, y = 0;
      heartShape.moveTo(x + 0.25, y + 0.25);
      heartShape.bezierCurveTo(x + 0.25, y + 0.25, x, y, x, y - 0.25);
      heartShape.bezierCurveTo(x, y - 0.75, x - 0.5, y - 0.75, x - 0.5, y - 0.75);
      heartShape.bezierCurveTo(x - 0.8, y - 0.75, x - 0.8, y - 0.35, x - 0.8, y - 0.35);
      heartShape.bezierCurveTo(x - 0.8, y, x - 0.5, y + 0.35, x, y + 0.7);
      heartShape.bezierCurveTo(x + 0.5, y + 0.35, x + 0.8, y, x + 0.8, y - 0.35);
      heartShape.bezierCurveTo(x + 0.8, y - 0.35, x + 0.8, y - 0.75, x + 0.5, y - 0.75);
      heartShape.bezierCurveTo(x + 0.2, y - 0.75, x + 0.25, y + 0.25, x + 0.25, y + 0.25);

      const extrudeSettings = {
        depth: 0.15,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 1,
        bevelSize: 0.08,
        bevelThickness: 0.08
      };

      const geo = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
      geo.center();
      return geo;
    }

    const baseHeartGeo = createHeartGeometry();
    const heartMaterials = [
      new THREE.MeshPhongMaterial({ color: 0xff007f, emissive: 0x550022, shininess: 80 }),
      new THREE.MeshPhongMaterial({ color: 0xff3366, emissive: 0x440011, shininess: 90 }),
      new THREE.MeshPhongMaterial({ color: 0xa855f7, emissive: 0x220044, shininess: 100 })
    ];

    // Group for all orbiting objects
    const orbitObjects = [];

    // --- 5. CANVAS TEXT SPRITE CREATOR (Neon Curved Glowing Text) ---
    function createNeonTextSprite(text, icon = '', neonHex = '#ff007f') {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Glow effect background
      const fullText = icon ? `${icon}  ${text}` : text;
      
      ctx.font = 'Bold 36px "Outfit", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Multi-layer neon shadow glow
      ctx.shadowColor = neonHex;
      ctx.shadowBlur = 18;
      ctx.fillStyle = neonHex;
      ctx.fillText(fullText, 256, 64);

      ctx.shadowBlur = 8;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(fullText, 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({
        map: texture,
        transparent: true,
        blending: THREE.AdditiveBlending
      });

      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(6, 1.5, 1);
      return sprite;
    }

    // --- 6. POPULATE INITIAL ORBITING ELEMENTS (Hearts, Text, Sprites) ---
    const defaultMessages = [
      { text: "ERES MAGIA", icon: "✨", color: "#ff007f" },
      { text: "TE ADORO", icon: "💖", color: "#ff3366" },
      { text: "FELIZ CUMPLEAÑOS", icon: "🎂", color: "#a855f7" },
      { text: "FOREVER TOGETHER", icon: "💍", color: "#ff007f" },
      { text: "MI REFUGIO", icon: "🏠", color: "#ff69b4" },
      { text: "I LOVE YOU 3000", icon: "🕷️", color: "#ff3366" },
      { text: "HELLO KITTY LOVE", icon: "🎀", color: "#ff007f" },
      { text: "YOU ARE MY UNIVERSE", icon: "🌌", color: "#a855f7" }
    ];

    function addObjectToOrbit(meshOrSprite, radius, speed, heightOffset) {
      const angle = Math.random() * Math.PI * 2;
      meshOrSprite.userData = {
        radius: radius,
        angle: angle,
        speed: speed,
        yOffset: heightOffset,
        rotSpeedX: (Math.random() - 0.5) * 0.02,
        rotSpeedY: (Math.random() - 0.5) * 0.02
      };

      // Set initial position
      meshOrSprite.position.x = Math.cos(angle) * radius;
      meshOrSprite.position.z = Math.sin(angle) * radius;
      meshOrSprite.position.y = heightOffset;

      scene.add(meshOrSprite);
      orbitObjects.push(meshOrSprite);
    }

    // Add 3D Hearts
    for (let i = 0; i < 60; i++) {
      const mat = heartMaterials[i % heartMaterials.length];
      const heartMesh = new THREE.Mesh(baseHeartGeo, mat);
      
      const scale = 0.35 + Math.random() * 0.45;
      heartMesh.scale.set(scale, scale, scale);

      const radius = 4.5 + Math.random() * 16;
      const speed = 0.003 + (1.0 / radius) * 0.015;
      const yOffset = (Math.random() - 0.5) * 3.5;

      // Make hearts lay down slightly tilted along disk
      heartMesh.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.4;

      addObjectToOrbit(heartMesh, radius, speed, yOffset);
    }

    // Add Initial Glowing Neon Text Messages
    defaultMessages.forEach((item, idx) => {
      const textSprite = createNeonTextSprite(item.text, item.icon, item.color);
      const radius = 6 + (idx * 1.8) + (Math.random() * 2);
      const speed = 0.004 + (1.0 / radius) * 0.012;
      const yOffset = (Math.random() - 0.5) * 2;

      addObjectToOrbit(textSprite, radius, speed, yOffset);
    });

    // --- 7. COSMIC BACKGROUND STARFIELD ---
    const bgStarGeo = new THREE.BufferGeometry();
    const bgStarCount = 2000;
    const bgStarPos = new Float32Array(bgStarCount * 3);

    for (let i = 0; i < bgStarCount * 3; i += 3) {
      bgStarPos[i] = (Math.random() - 0.5) * 200;
      bgStarPos[i + 1] = (Math.random() - 0.5) * 200;
      bgStarPos[i + 2] = (Math.random() - 0.5) * 200;
    }

    bgStarGeo.setAttribute('position', new THREE.BufferAttribute(bgStarPos, 3));
    const bgStarMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.25,
      transparent: true,
      opacity: 0.8
    });
    const bgStarField = new THREE.Points(bgStarGeo, bgStarMat);
    scene.add(bgStarField);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const centerPointLight = new THREE.PointLight(0xff007f, 3, 35);
    centerPointLight.position.set(0, 0, 0);
    scene.add(centerPointLight);

    // --- 8. ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Rotate Center Black Hole & Shader Time
      diskShaderMat.uniforms.uTime.value = time;
      horizonGlow.rotation.y += 0.005;
      horizonGlow.rotation.z += 0.003;

      // Animate Swirling Particle Dust
      const positions = particleSystem.geometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        const p = particleData[i];
        if (isOrbiting) {
          p.angle += p.speed * orbitSpeedMultiplier;
        }

        positions[i * 3] = Math.cos(p.angle) * p.radius;
        positions[i * 3 + 2] = Math.sin(p.angle) * p.radius;
        positions[i * 3 + 1] = p.yOffset + Math.sin(time * 1.5 + p.angle) * 0.15;
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;

      // Animate Orbiting Hearts & Text Sprites
      orbitObjects.forEach((obj) => {
        if (isOrbiting) {
          obj.userData.angle += obj.userData.speed * orbitSpeedMultiplier;
        }

        const r = obj.userData.radius;
        const a = obj.userData.angle;

        obj.position.x = Math.cos(a) * r;
        obj.position.z = Math.sin(a) * r;
        obj.position.y = obj.userData.yOffset + Math.sin(time * 2.0 + a) * 0.2;

        // Individual Object Rotation (For 3D Mesh Hearts)
        if (obj.isMesh) {
          obj.rotation.x += obj.userData.rotSpeedX;
          obj.rotation.y += obj.userData.rotSpeedY;
        }
      });

      // Slowly rotate background stars
      bgStarField.rotation.y = time * 0.01;

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    // --- 9. UI INTERACTIONS & EVENT LISTENERS ---
    
    // Window Resize Listener
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Modal Add Message Controls
    const modal = document.getElementById('msg-modal');
    const openModalBtn = document.getElementById('add-msg-btn');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const addMsgForm = document.getElementById('add-msg-form');

    openModalBtn.addEventListener('click', () => {
      modal.classList.remove('hidden');
    });

    closeModalBtn.addEventListener('click', () => {
      modal.classList.add('hidden');
    });

    // Form Submit Handler -> Add New Floating Message into 3D Orbit!
    addMsgForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const textVal = document.getElementById('custom-text-input').value.trim();
      const iconVal = document.getElementById('custom-icon-select').value;
      const neonColor = document.querySelector('input[name="neon-color"]:checked').value;

      if (textVal) {
        const newSprite = createNeonTextSprite(textVal.toUpperCase(), iconVal, neonColor);
        const randomRadius = 5 + Math.random() * 15;
        const speed = 0.005 + (1.0 / randomRadius) * 0.015;
        const yOffset = (Math.random() - 0.5) * 3;

        addObjectToOrbit(newSprite, randomRadius, speed, yOffset);

        // Reset and close
        document.getElementById('custom-text-input').value = '';
        modal.classList.add('hidden');
      }
    });

    // Orbit Speed Slider
    const speedSlider = document.getElementById('speed-slider');
    speedSlider.addEventListener('input', (e) => {
      orbitSpeedMultiplier = parseFloat(e.target.value);
    });

    // Pause / Play Toggle
    const toggleOrbitBtn = document.getElementById('toggle-orbit-btn');
    const orbitIcon = document.getElementById('orbit-icon');
    const orbitText = document.getElementById('orbit-text');

    toggleOrbitBtn.addEventListener('click', () => {
      isOrbiting = !isOrbiting;
      if (isOrbiting) {
        orbitIcon.className = "fa-solid fa-pause";
        orbitText.innerText = "Jeda";
      } else {
        orbitIcon.className = "fa-solid fa-play";
        orbitText.innerText = "Mula";
      }
    });

    // Reset Camera Position
    const resetCamBtn = document.getElementById('reset-cam-btn');
    resetCamBtn.addEventListener('click', () => {
      controls.reset();
      camera.position.set(0, 18, 32);
    });

  </script>
</body>
</html>
